stages: [security]

codeshield:
  stage: security
  image: python:3.12-slim
  variables:
    PIP_DISABLE_PIP_VERSION_CHECK: "1"
    CODESHIELD_FAIL_ON: "high"
  script:
    - python3 clients/cli/codeshield.py . --server "$CODESHIELD_SERVER" --cookie "$CODESHIELD_COOKIE" --json codeshield-report.json
    - python3 -c 'import json, os, sys; order = ["info", "low", "medium", "high", "critical"]; threshold = os.getenv("CODESHIELD_FAIL_ON", "high").lower(); report = json.load(open("codeshield-report.json")); findings = report.get("findings", []); blocking = [item for item in findings if order.index(str(item.get("severity", "info")).lower()) >= order.index(threshold)]; print(f"CodeShield quality gate: fail on {threshold.upper()}+ · {len(blocking)} blocking finding(s) · {len(findings)} total"); sys.exit(1 if blocking else 0)'
  artifacts:
    when: always
    paths: [codeshield-report.json]
