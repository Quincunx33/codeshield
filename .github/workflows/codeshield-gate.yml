name: CodeShield quality gate
on: [push, pull_request]
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.x' }
      - name: Run CodeShield scan
        env:
          CODESHIELD_SERVER: ${{ secrets.CODESHIELD_SERVER }}
          CODESHIELD_COOKIE: ${{ secrets.CODESHIELD_COOKIE }}
        run: python3 clients/cli/codeshield.py . --server "$CODESHIELD_SERVER" --json codeshield-report.json
      - name: Enforce release policy
        run: |
          python3 - <<'PY'
          import json, sys
          report = json.load(open('codeshield-report.json'))
          critical = report.get('summary', {}).get('critical', 0)
          high = report.get('summary', {}).get('high', 0)
          print(f"CodeShield gate: {critical} critical, {high} high")
          sys.exit(1 if critical or high else 0)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: codeshield-report, path: codeshield-report.json }
