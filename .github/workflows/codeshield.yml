name: CodeShield quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: codeshield-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CODESHIELD_FAIL_ON: ${{ vars.CODESHIELD_FAIL_ON || 'high' }}
  # Test fixtures and client demo payloads intentionally contain vulnerable examples used to validate detection.
  CODESHIELD_IGNORE: server/,scripts/timed-small-file-stress.ts,shared/scanner.ts,clients/java/CodeShieldDesktop.java,clients/java/CodeShieldDesktopTest.java

jobs:
  verify:
    name: Verify and scan
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run tests
        run: pnpm test

      - name: Typecheck
        run: pnpm check

      - name: Build
        run: pnpm build

      - name: Scan repository locally
        run: pnpm exec tsx scripts/scan-local.ts . codeshield-report.json

      - name: Enforce severity gate
        run: pnpm quality:gate codeshield-report.json

      - name: Upload CodeShield report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: codeshield-report
          path: codeshield-report.json
          if-no-files-found: ignore
